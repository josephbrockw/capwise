services:
  broker:
    image: redis:alpine
    container_name: broker

  db:
    image: postgres:15
    container_name: db
    volumes:
      - postges_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=db_dev
    ports:
      - 5432:5432

  backend:
    build: django
    container_name: backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./django/:/usr/src/backend/
    ports:
      - 8009:8000
    env_file:
      - django/.env.dev
      - django/.env.secrets
    environment:
      - WAIT_FOR_BROKER=${WAIT_FOR_BROKER:-false}
    depends_on:
      - db

  celery:
    build: django
    container_name: django_worker
    command: celery -A worker worker --hostname=djangoworker --loglevel=info -Q default -E -B
    volumes:
      - ./django/:/usr/src/backend/
    env_file:
      - django/.env.dev
      - django/.env.secrets
    depends_on:
      - db
      - broker
      - backend

  frontend:
    build:
      context: ./react
      dockerfile: Dockerfile.dev
    container_name: frontend
    volumes:
      - ./react:/app
      - /app/node_modules
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    env_file:
      - react/.env.dev
    stdin_open: true
    depends_on:
      - backend

  celery2:
    build: celeryworker
    container_name: independent_worker
    command: celery -A worker_app worker --hostname=independentworker --loglevel=info -Q queue2
    working_dir: /usr/src/celeryworker
    volumes:
      - ./celeryworker/:/usr/src/celeryworker/
    depends_on:
      - broker

  flower:
    image: mher/flower
    container_name: flower
    ports:
      - 5555:5555
    environment:
      - CELERY_BROKER_URL=redis://broker:6379/0
    depends_on:
      - broker

  docs:
    build:
      context: ./docs
      dockerfile: Dockerfile.dev
    container_name: docs
    volumes:
      - ./docs:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    stdin_open: true
    tty: true

  native-app:
    build:
      context: ./app
      dockerfile: Dockerfile.dev
    container_name: native-app
    command: npm run start -- --tunnel # Use tunnel mode for Expo Go
    volumes:
      # Mount the app code, excluding node_modules to use container's version
      - ./app:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      # Expo Metro Bundler
      - "8081:8081"
      # Expo Go connection ports
      - "19000:19000"
      - "19001:19001"
      # Expo Dev Tools
      - "19002:19002"
    environment:
      # Ensure Expo server binds to 0.0.0.0 to be accessible outside the container
      - EXPO_DEV_SERVER_HOSTNAME=0.0.0.0
      # Enable polling if hot-reloading issues occur within Docker
      - WATCHPACK_POLLING=true
    # Keep stdin open for potential interactive prompts from Expo CLI
    stdin_open: true
    tty: true # Allocate a TTY for Expo CLI
    depends_on:
      - backend

volumes:
  postges_data:
