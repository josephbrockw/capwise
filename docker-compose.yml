version: '3.8'

services:
  backend:
    build: backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend/:/usr/src/backend/
    ports:
      - 8009:8000
    env_file:
      - backend/.env.dev
    depends_on:
      - db
  db:
    image: postgres:15
    volumes:
      - postges_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=db_dev

volumes:
    postges_data:
