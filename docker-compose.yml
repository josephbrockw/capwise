version: '3.8'

services:
  backend:
    build: backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend/:/usr/src/backend/
    ports:
      - 8009:8000
    env_file:
      - backend/.env.dev
      - backend/.env.secrets
    depends_on:
      - db
  db:
    image: postgres:15
    volumes:
      - postges_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=db_dev
    ports:
      - 5432:5432

  frontend:
    build:
      context: ./client
    command: yarn start
    depends_on:
      - backend
    environment:
      - CHOKIDAR_USEPOLLING=true
      - REACT_APP_API_BASE_URL=http://localhost:8009
      - REACT_APP_NAME=BaseBuild
      - REACT_APP_URL=http://localhost:3001
    ports:
      - 3001:3000
    stdin_open: true
    volumes:
      - ./client:/usr/src/app

volumes:
    postges_data:
